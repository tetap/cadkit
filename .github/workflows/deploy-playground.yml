name: Deploy Playground

on:
  push:
    branches: [main]
  workflow_dispatch:

# Prefer Node 24 for JS actions (Node 20 is deprecated on GitHub runners).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install

      # Workspace packages emit dist/ that some consumers resolve; build the graph first.
      - run: pnpm build

      # Creates / enables the Pages site with "GitHub Actions" as source when missing.
      # Without this, deploy-pages returns HttpError: Not Found.
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build playground for GitHub Pages
        env:
          VITE_BASE: /cadkit/
        run: pnpm --filter @cadkit/playground build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/playground/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
