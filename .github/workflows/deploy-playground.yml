name: Deploy Playground

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Push built site to the `gh-pages` branch (Settings → Pages → Deploy from a branch).
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install
      - run: pnpm build

      - name: Build playground for GitHub Pages
        env:
          VITE_BASE: /cadkit/
        run: pnpm --filter @cadkit/playground build

      - name: Add .nojekyll
        run: touch apps/playground/dist/.nojekyll

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/playground/dist
          publish_branch: gh-pages
          force_orphan: true
