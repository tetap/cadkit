<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CADKit Playground</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1440px; height: 900px; overflow: hidden; font-family: 'DM Sans', 'Segoe UI', sans-serif; color: #1f2937; background: #f3f4f6; }
      .app { display: flex; width: 1440px; height: 900px; }
      .rail { width: 56px; border-right: 1px solid #e5e7eb; background: #f3f4f6; display: flex; flex-direction: column; align-items: center; padding: 12px 8px; gap: 4px; }
      .logo { width: 40px; height: 40px; border-radius: 12px; background: #22c55e; color: #fff; display: grid; place-items: center; box-shadow: 0 4px 10px rgba(34,197,94,.28); margin-bottom: 6px; }
      .sep { width: 28px; height: 1px; background: #d4d4d8; margin: 4px 0; }
      .icon { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: #475569; }
      .icon.active { background: #16a34a; color: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
      .icon svg { width: 20px; height: 20px; }
      .main { flex: 1; position: relative; background: #d8dde3; }
      .rulers-x { position: absolute; left: 24px; right: 0; top: 0; height: 24px; background: #eef1f4; border-bottom: 1px solid #d1d5db; }
      .rulers-y { position: absolute; left: 0; top: 24px; bottom: 0; width: 24px; background: #eef1f4; border-right: 1px solid #d1d5db; }
      .work { position: absolute; left: 72px; top: 56px; width: 820px; height: 620px; background: #fff; box-shadow: 0 18px 50px rgba(15,23,42,.12); }
      .grid { width: 100%; height: 100%; background-image:
        linear-gradient(to right, #eef2f6 1px, transparent 1px),
        linear-gradient(to bottom, #eef2f6 1px, transparent 1px);
        background-size: 28px 28px; }
      .ctx { position: absolute; left: 50%; top: 36px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.96); border: 1px solid #e5e7eb; border-radius: 16px; padding: 8px 12px; box-shadow: 0 10px 28px rgba(15,23,42,.1); font-size: 12px; }
      .chip { height: 28px; padding: 0 10px; border: 1px solid #d4d4d8; border-radius: 8px; display: grid; place-items: center; background: #fff; color: #374151; }
      .chip.green { background: #16a34a; color: #fff; border-color: #16a34a; }
      .viewbar { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,.96); border: 1px solid #e5e7eb; border-radius: 16px; padding: 6px 10px; box-shadow: 0 8px 28px rgba(15,23,42,.12); font-size: 12px; font-weight: 600; }
      .vb { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: #4b5563; }
      .layers { position: absolute; left: 36px; top: 88px; width: 240px; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; box-shadow: 0 12px 32px rgba(15,23,42,.12); padding: 12px; }
      .layers h3 { font-family: Outfit, sans-serif; font-size: 13px; margin-bottom: 10px; }
      .ly { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 8px; font-size: 12px; }
      .ly.on { background: #f0fdf4; }
      .dot { width: 10px; height: 10px; border-radius: 99px; }
      .side { width: 240px; border-left: 1px solid #e5e7eb; background: #fff; display: flex; flex-direction: column; }
      .card { margin: 12px; padding: 12px; border: 1px solid #e5e7eb; border-radius: 10px; background: #f3f4f6aa; }
      .card h3 { font-family: Outfit, sans-serif; font-size: 13px; margin-bottom: 6px; }
      .muted { color: #6b7280; font-size: 11px; }
      .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 10px 0; }
      .mode { height: 34px; border: 1px solid #d4d4d8; border-radius: 8px; display: grid; place-items: center; font-size: 12px; background: #fff; }
      .mode.on { border-color: #16a34a; background: #f0fdf4; color: #166534; font-weight: 600; }
      .field { margin-top: 10px; }
      .field label { display: block; font-size: 12px; color: #6b7280; margin-bottom: 4px; }
      .field .box { height: 32px; border: 1px solid #d4d4d8; border-radius: 8px; background: #fff; display: flex; align-items: center; padding: 0 10px; font-size: 12px; }
      .preview { margin: 12px; height: 40px; border: 1px solid rgba(34,197,94,.4); background: rgba(34,197,94,.1); color: #166534; border-radius: 8px; display: grid; place-items: center; font-size: 12px; font-weight: 600; }
      .status { border-top: 1px solid #e5e7eb; padding: 8px 12px; font-size: 11px; color: #6b7280; }
    </style>
  </head>
  <body>
    <div class="app">
      <nav class="rail">
        <div class="logo"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 4h12v12H4z"/><path d="M10 1v18M1 10h18"/></svg></div>
        <div class="sep"></div>
        <div class="icon active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="m5 3 6.8 17 2.1-6.1L20 11.8 5 3Z"/><path d="m14 14 4.5 4.5"/></svg></div>
        <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M18 11V7a2 2 0 0 0-4 0v3"/><path d="M14 10V5a2 2 0 0 0-4 0v5"/><path d="M10 10V7a2 2 0 0 0-4 0v7"/><path d="M6 12.5 4.8 11a2 2 0 0 0-3 2.6l4.7 5.5A5 5 0 0 0 10.3 21H14a6 6 0 0 0 6-6v-4a2 2 0 0 0-4 0v1"/></svg></div>
        <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="5" cy="18.5" r="1.5"/><circle cx="19" cy="5.5" r="1.5"/><path d="m6.1 17.5 11.8-11"/></svg></div>
        <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="4" y="5" width="16" height="14" rx="1.5"/></svg></div>
        <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><ellipse cx="12" cy="12" rx="9" ry="6.5"/></svg></div>
        <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="8.5"/></svg></div>
        <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/></svg></div>
        <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="m12 3 2.4 5.7 6.2.5-4.7 4 1.5 6.1L12 16.2 6.6 19.3l1.5-6.1-4.7-4 6.2-.5L12 3Z"/></svg></div>
        <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="m3.5 17 5-10 6 7 6-10"/></svg></div>
        <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="m12 19 7-7 3 3-7 7-4 1 1-4Z"/></svg></div>
        <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 20c2-1 3-4 4-7s3-5 6-6 5 0 6 2-1 5-3 6-5 2-7 3-5 3-6 2Z"/></svg></div>
        <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M5 5h14"/><path d="M12 5v14"/></svg></div>
        <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="4" width="18" height="16" rx="2"/></svg></div>
        <div class="sep"></div>
        <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M12 3v12"/><path d="m8 11 4 4 4-4"/><path d="M4 19h16"/></svg></div>
      </nav>
      <section class="main">
        <div class="rulers-x"></div>
        <div class="rulers-y"></div>
        <div class="work">
          <div class="grid"></div>
          <svg viewBox="0 0 820 620" width="820" height="620" style="position:absolute;inset:0">
            <rect x="90" y="70" width="420" height="240" rx="28" fill="#2563eb18" stroke="#2563eb" stroke-width="2.2"/>
            <path d="M560 118c-18-28-58-22-70 8-12-30-52-36-70-8-22 34 8 78 70 118 62-40 92-84 70-118Z" fill="#ef4444" opacity=".92"/>
            <path d="M668 86l18 38 42 4-32 28 10 40-38-22-38 22 10-40-32-28 42-4 18-38z" fill="#f59e0b"/>
            <text x="110" y="400" font-family="Outfit, DM Sans, sans-serif" font-size="54" font-weight="700" fill="#f59e0b">CADKit</text>
            <text x="110" y="448" font-family="DM Sans, sans-serif" font-size="22" fill="#2563eb">Laser engraving · Pen plotter</text>
            <path d="M110 500 Q 250 460 390 500 T 670 500" fill="none" stroke="#16a34a" stroke-width="2.4"/>
            <text x="250" y="492" font-family="DM Sans, sans-serif" font-size="20" fill="#16a34a">HELLO</text>
          </svg>
        </div>
        <div class="ctx">
          <div class="chip green">Select</div>
          <div class="chip">W 180</div>
          <div class="chip">H 96</div>
          <div class="chip">Radius 12</div>
          <div class="chip">Union</div>
          <div class="chip">Offset</div>
        </div>
        <aside class="layers">
          <h3>Layers</h3>
          <div class="ly on"><span class="dot" style="background:#2563eb"></span>Outline · Line · S800</div>
          <div class="ly"><span class="dot" style="background:#f59e0b"></span>Text · Fill · 45°</div>
          <div class="ly"><span class="dot" style="background:#ef4444"></span>Decor · Line</div>
          <div class="ly"><span class="dot" style="background:#64748b"></span>Photo · Image scan</div>
        </aside>
        <div class="viewbar">
          <div class="vb">↺</div>
          <div class="vb">↻</div>
          <span style="width:1px;height:20px;background:#e5e7eb"></span>
          <div class="vb">−</div>
          <span>100%</span>
          <div class="vb">+</div>
          <span style="padding:0 6px;font-weight:500">Fit</span>
          <span style="width:1px;height:20px;background:#e5e7eb"></span>
          <div class="vb">☰</div>
        </div>
      </section>
      <aside class="side">
        <div class="card">
          <h3>Engrave params</h3>
          <p class="muted">Outline</p>
          <div class="muted" style="margin-top:10px">Engrave mode</div>
          <div class="modes">
            <div class="mode on">Line</div>
            <div class="mode">Fill</div>
          </div>
        </div>
        <div class="card">
          <h3>Machine</h3>
          <div class="field"><label>Power</label><div class="box">800</div></div>
          <div class="field"><label>Speed</label><div class="box">3000 mm/min</div></div>
          <div class="field"><label>Passes</label><div class="box">1</div></div>
        </div>
        <div style="flex:1"></div>
        <div class="preview">Preview G-code toolpaths</div>
        <div class="status">GRBL · 4 layers · ready to export</div>
      </aside>
    </div>
  </body>
</html>
